summary: >-
  Jellyvision serves a live, OAuth-protected Model Context Protocol server from its own marketing
  host. It was found by following RFC 9728 protected-resource metadata at
  https://www.jellyvision.com/.well-known/oauth-protected-resource, which names the resource
  https://www.jellyvision.com/wp-json/mcp/mcp-oauth-server and the authorization server
  https://www.jellyvision.com, and it was confirmed live by POSTing MCP JSON-RPC to that endpoint.
scope_warning: >-
  This is a CONTENT MCP server on the WordPress marketing site, not an ALEX product API server. It
  is served from the /wp-json/ REST namespace of www.jellyvision.com and its OAuth server advertises
  only the "mcp" scope with dynamic client registration. Nothing observed connects it to the ALEX
  Partner Integration API, whose surface lives on myalex.com behind separate Auth0 client-credentials
  tenants. Do not read this as agent access to ALEX benefits data.
