headline_finding: >-
  Jellyvision publishes NO client library for the ALEX Partner Integration API in any language. The
  V1 API Reference documents raw curl only and links no SDK. Everything Jellyvision has published to
  a public registry is internal front-end framework or build tooling from 2016-2017, all of it under
  the shared "jellyops" npm account or the @jellyvision scope, and none of it wraps the API. No
  SDKs pointer is emitted in apis.yml because no API client library exists to point at.
