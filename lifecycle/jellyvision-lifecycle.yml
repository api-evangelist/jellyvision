operational_guardrails:
  source: Authentication > Guardrails section of the V1 API Reference
  note: Jellyvision states it cannot guarantee ALEX performance without these client behaviors.
  rules:
  - Automatically request a new access token when an API call receives a 401 Unauthorized response.
  - Request a new access token every 24 hours.
  - Do not request an access token with each API call; doing so will cause rate limiting errors.
