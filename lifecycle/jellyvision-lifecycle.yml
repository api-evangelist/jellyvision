status_page:
  published: false
  url: https://status.jellyvision.com/
  observed_status: 200
  gate: >-
    Reachable but not public. https://status.jellyvision.com/ immediately 302s into
    /auth/dex/auth/saml and posts a SAMLRequest to
    https://jellyvision.okta.com/app/jellyvision_jellyvisionstatuspage_1/.../sso/saml — an Okta
    SSO wall. A partner or integrator with no Jellyvision Okta identity cannot read incident or
    uptime history, so no StatusPage pointer is emitted; the surface exists but is not a published
    one.
  checked: '2026-08-23'
sla:
