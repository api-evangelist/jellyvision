domain_standards:
  note: >-
    Reward-only check. Jellyvision operates in US employee benefits enrollment, a market that does
    have real interchange standards — X12 EDI 834 Benefit Enrollment and Maintenance is the dominant
    one for carrier/employer eligibility exchange, and LIMRA/ACORD shapes appear in voluntary
    benefits. The ALEX Partner Integration API DECLARES NONE OF THEM. Its plan, premium-tier and
    contribution model is entirely proprietary: partner-defined plan codes (partnerCode) mapped to
    Jellyvision-issued plan codes (alexCode), and coverage expressed as Jellyvision tier codes 10-90
    under seven proprietary tierCoverageTypeId shapes. There is no 834 segment, no ACORD schema, no
    FHIR resource and no SCIM/OData/OAuth-domain-profile surface in the contract. Recorded as absent,
    not as a penalty.
  declared: []
  probed_for:
  - X12 EDI 834 Benefit Enrollment and Maintenance
  - ACORD
  - FHIR (HL7)
  - SCIM (urn:ietf:params:scim:schemas:*)
  - OData $metadata
  integration_consequence: >-
    A benefits administration platform already speaking 834 cannot reuse it here; every partner must
    build a bilateral mapping from its own plan codes into ALEX's partnerCode/alexCode and tier-code
    model. That mapping cost is the practical meaning of this row.
