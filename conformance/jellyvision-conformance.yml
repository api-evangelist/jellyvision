  conforms: true
  evidence: >-
    Authorization header carries "Bearer <jwt>"; the MCP endpoint returns a compliant
    WWW-Authenticate: Bearer challenge with realm and resource_metadata parameters.
- id: rfc7519
  name: JSON Web Token (RFC 7519)
  conforms: true
  evidence: >-
    The docs describe the API key as "a signed JSON Web Token (JWT)" and publish a decoded example
