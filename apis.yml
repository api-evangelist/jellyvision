aid: jellyvision
name: Jellyvision
description: >-
  Jellyvision (The Jellyvision Lab, Inc.) is a Chicago-based employee benefits engagement company
  and the maker of ALEX, a benefits decision-support, communication and administration platform used
  by employers, brokers and carriers to guide employees through medical, dental, vision, retirement,
  HSA/FSA and voluntary benefit choices. Its developer surface is the ALEX Partner Integration API — a
  partner-facing REST API documented publicly at partner-api-docs.myalex.com that lets benefits
  administration and enrollment platforms pre-populate end-user demographic and eligibility data,
  push per-plan premium and employer healthfund contribution tiers into an ALEX Session, and read
  back the medical, dental, vision, HSA and FSA selections a user made inside the ALEX experience.
  Authentication is OAuth 2.0 client credentials against an Auth0 tenant plus SAML 2.0 IdP-initiated
  single sign-on for the end-user experience.
