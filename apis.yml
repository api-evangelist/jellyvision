apis:
- aid: jellyvision:alex-partner-integration-api
  name: ALEX Partner Integration API
  description: >-
    The ALEX Partner Integration API lets a Jellyvision partner — typically a benefits administration
    or enrollment platform — streamline and personalize the ALEX experience for its end users. Partners
    POST end-user demographic data (salary, eligible pay, postal code, state, full-time status, birth
    date, spouse type and birth date, plus optional expat, hire date, hours worked and dependent counts)
    to pre-answer eligibility questions; POST an ALEX Session carrying the medical, dental, vision and
    tax-savings plans a user is eligible for along with annualized premium tiers, employer healthfund
    contribution tiers and payroll deductions per year; and GET back the plan selections, coverage
    premium tiers and HSA/FSA contribution amounts the user chose inside ALEX. Custom and external
    partner-defined parameters are supported at Jellyvision's discretion.
  humanURL: https://partner-api-docs.myalex.com/
  baseURL: https://www.myalex.com
  x-base-url-note: >-
    Provider-stated, not inferred. The 'ALEX targets and environments' table in the appendix of the
    V1 API Reference publishes a column literally headed 'API url' whose Production value is
    https://www.myalex.com (Pre-production: https://qa.myalex.com). repair-api-bases.py flags this
    host as 'docs-host' on a www.* heuristic, which is a false positive here: www.myalex.com is the
    ALEX application host and the documented API host, and the reference's curl samples use
    example.com placeholders rather than naming a host inline. api.myalex.com also resolves (to
    api-production.jellysecure.com, returning API-Gateway-shaped JSON) but is named nowhere in the
    docs and returns HTTP 404 on /api/partner/user, so it was NOT adopted as the base.
  tags:
  - Employee Benefits
  - Benefits Enrollment
  - Eligibility
  - Decision Support
  - Human Resources
